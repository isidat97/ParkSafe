name: parksafe
description: ParkSafe - Smart Car Parking Slot Booking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.4

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.0

  # UI & Icons
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # Date & Time
  intl: ^0.19.0
  table_calendar: ^3.1.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0

  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # Network & Utils
  dio: ^5.4.3+1
  uuid: ^4.4.0
  google_fonts: ^6.2.1

  # Image
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  gal: ^2.3.0

  # Permission
  permission_handler: ^11.3.1

  # Animations
  flutter_animate: ^4.5.0

  # Misc
  url_launcher: ^6.3.0

  # Firebase & Notifications
  firebase_core: ^3.1.1
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
